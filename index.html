<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paragon — Color+Light</title>
  <link rel="icon" type="image/png" href="paragon-icon.png">
  <meta name="description" content="Paragon is professional lighting control for macOS. Download the latest notarized build.">
  <style>
    :root {
      --bg: #0b0d10;
      --text: #f4f6f8;
      --muted: #9aa3ad;
      --blue: #3ea5f8;
      --blue-dark: #1a5299;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    main {
      width: min(440px, 100%);
      text-align: center;
    }
    .mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      border-radius: 20px;
      overflow: hidden;
    }
    .mark img { display: block; width: 100%; height: 100%; }
    h1 {
      font-size: 42px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin: 0 0 10px;
    }
    p.lede {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
    }
    a.download {
      display: inline-block;
      background: var(--blue);
      color: #061018;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      padding: 13px 22px;
      border-radius: 10px;
    }
    a.download:hover { background: #62b6ff; }
    .meta {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="mark">
      <img src="paragon-icon.png" width="88" height="88" alt="Paragon">
    </div>
    <h1>Paragon</h1>
    <p class="lede">Professional lighting control for macOS.</p>
    <a class="download" id="download"
       href="https://github.com/colorandlight/paragon-releases/releases/download/v0.2.0/Paragon-0.2.0.dmg">
      Download for macOS
    </a>
    <p class="meta" id="meta">Version 0.2.0 · Developer ID signed and notarized</p>
    <footer>
      <a href="https://colorandlight.art">Color+Light</a>
    </footer>
  </main>
  <script>
    fetch("https://api.github.com/repos/colorandlight/paragon-releases/releases/latest")
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (rel) {
        var dmg = (rel.assets || []).find(function (a) { return /\.dmg$/i.test(a.name); });
        if (!dmg) return;
        var version = String(rel.tagName || "").replace(/^v/, "");
        document.getElementById("download").href = dmg.browser_download_url;
        document.getElementById("meta").textContent =
          "Version " + version + " · Developer ID signed and notarized";
      })
      .catch(function () {});
  </script>
</body>
</html>
